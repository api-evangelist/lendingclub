description: >-
  LendingClub — trading since 2026 as Happen Bank, N.A. — publishes NO API plans, tiers,
  quotas or pricing of any kind. There is no /pricing page (the path returns the marketing
  homepage under a soft-404), and no pricing appears anywhere in the 679-URL sitemap for a
  developer or API product. The company's only published pricing is consumer-facing loan
  rates and fees, which price a loan rather than API access.
notes: >-
  plan_count is 0 by measurement, not by omission. Access to the API surface still
  marketed on the institutional-investing page ("API-driven purchasing") is obtained
  through the institutions-and-banks contact form, so commercial terms are negotiated
  inside an institutional investor or bank-partner agreement and never published. This
  file REPLACES a 2026-05-04 bulk-sweep artifact that invented a "Partner / Custom"
  enterprise tier with a "contact provider" price; that plan was never published by
  LendingClub and has been removed rather than carried forward (roadmap#35).

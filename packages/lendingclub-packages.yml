specification: API Commons Packages
specificationVersion: '0.1'
provider: LendingClub
providerId: lendingclub
generated: '2026-09-06'
method: searched
source: >-
  registry.npmjs.org (name lookups + /-/v1/search), pypi.org/pypi/<pkg>/json,
  rubygems.org/api/v1/gems/<pkg>.json, and the LendingClub GitHub organization
  (api.github.com/orgs/LendingClub/repos).
summary: >-
  LendingClub publishes NO first-party client library on any registry. Every package that
  wraps a LendingClub API is a third-party community wrapper of the retail Investor API,
  the marketplace that was itself retired in December 2020. The newest of them last
  published in 2024; the rest date from 2015-2018. official_count is 0.
official_count: 0
package_count: 5
github_organization:
  url: https://github.com/LendingClub
  status: 200
  public_repos: 4
  note: >-
    Four public repositories, all internal Java tooling or upstream forks
    (gradle-maven-plugin, breeze-http-client, docker-java, neo4j-java-driver). None is a
    client library for a LendingClub API. Most recent push 2021-09-24.

description: >-
  LendingClub / Happen Bank publishes no API rate-limit documentation. The pages that once
  carried the API's general considerations — /developers/considerations and the LCX
  Primary/Secondary Market technical documentation — now return HTTP 404, and nothing on
  the current happen.com surface documents a limit, a window, a burst allowance, or a
  rate-limit response header.
notes: >-
  limit_count is 0 by measurement. No X-RateLimit-*, RateLimit-* or Retry-After header
  could be observed either: the only reachable endpoints on api.lendingclub.com answer 401
  or 403 before any limit applies, and probing harder to elicit a 429 from a production
  bank host is out of bounds for this pipeline. This file REPLACES a 2026-05-04 bulk-sweep
  artifact that asserted an unpublished "Partner API Limit", a 429/503 response-code
  contract and two backoff policies, none of which LendingClub has published (roadmap#35).

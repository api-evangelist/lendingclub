      - {path: /.well-known/agent.json, status: 301, file: null}
unreachable_hosts:
  - host: developer.happen.com
    note: does not resolve (DNS failure, curl exit 6)
  - host: api.happen.com
    note: does not resolve (DNS failure, curl exit 6)
agent_posture:
  robots_txt:
    url: https://www.happen.com/robots.txt
    status: 200
    note: >-
      Named AI agent user-agents — GPTBot, ClaudeBot, PerplexityBot, Google-Extended,
      Applebot-Extended, cohere-ai, anthropic-ai — each receive the SAME Allow/Disallow
      block as the wildcard agent. No agent is singled out for exclusion, and /api/ is
      disallowed for every crawler including the wildcard.
  llms_txt:
    url: https://www.happen.com/llms.txt
    status: 404
    note: not published; a real 404, not a soft-404 shell

      - {path: /.well-known/agent-card.json, status: 403, file: null}
      - {path: /.well-known/agent.json, status: 403, file: null}
  - host: www.happen.com
    note: 302s every /.well-known/* path to the marketing homepage (soft-404)
    documents:
      - {path: /.well-known/security.txt, status: 302, file: null}
      - {path: /.well-known/openid-configuration, status: 302, file: null}
      - {path: /.well-known/oauth-authorization-server, status: 302, file: null}
      - {path: /.well-known/oauth-protected-resource, status: 302, file: null}
      - {path: /.well-known/api-catalog, status: 302, file: null}

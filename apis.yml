description: >-
  LendingClub is a US consumer-finance company and national bank, founded in 2006 as a
  peer-to-peer marketplace lender and now a Fortune 1000 digital bank following its 2021
  acquisition of Radius Bancorp. In 2026 it rebranded as Happen Bank, N.A. and moved its
  web presence from lendingclub.com to happen.com. It no longer operates a public
  developer program: the /developers tree and the LCX Primary and Secondary Market API
  technical documentation were withdrawn during the rebrand and now return HTTP 404, while
  the legacy investor host api.lendingclub.com remains live but gated and undocumented.
  The API the company still markets - "API-driven purchasing" inside Marketplace Connect
  for institutional loan buyers - is reachable only through an institutional contact-sales
  form, with no published reference or machine-readable contract.

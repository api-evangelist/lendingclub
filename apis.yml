apis:
  - aid: lendingclub:lendingclub-api
    name: LendingClub API
    tags:
      - Fintech
      - Personal Loans
      - Banking
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://api.lendingclub.com
    humanURL: https://www.happen.com/institutional-investing/overview
    properties:
      - url: lifecycle/lendingclub-lifecycle.yml
        type: Lifecycle
    description: >-
      No public contract or reference is published for this API. api.lendingclub.com is
      live and gated - /api/investor/v1/accounts/1/summary answers HTTP 401 and
      /api/investor/v1/loans/listing answers HTTP 403 - but the documentation that
      described it was withdrawn in 2026 (probed 2026-09-06). The former developer portal
      developer.lendingclub.com now 301s to the happen.com marketing homepage, and the
      /developers and LCX Primary/Secondary Market documentation trees return HTTP 404 on
      both domains. humanURL points at the institutional-investing page, which is the only
      live page that still states an API exists; access runs through the
      institutions-and-banks contact form.
